<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mado</title>
<style>
  :root {
    --bg: #14121a; --panel: #1d1a26; --panel2: #262233; --line: #34304a;
    --text: #ece9f5; --muted: #9a94b3; --accent: #ff7a59; --accent2: #ffb199; --danger: #ff6b81;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; }
  .brand { font-weight: 800; font-size: 22px; letter-spacing: .5px; cursor: pointer; }
  .brand span { color: var(--accent); }
  .who { display: flex; gap: 10px; align-items: center; color: var(--muted); }
  .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; }
  .btn:hover { border-color: var(--accent2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a0f0b; font-weight: 700; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: default; }
  .link { background: none; border: 0; color: var(--muted); padding: 2px 4px; text-decoration: underline; }
  .link:hover { color: var(--text); }
  input[type=text], input[type=password], select {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .auth { max-width: 360px; margin: 8vh auto 0; }
  .auth h1 { margin: 0 0 4px; }
  .auth form { display: grid; gap: 10px; margin-top: 14px; }
  .error { color: var(--danger); min-height: 1.4em; margin: 6px 0 0; }
  .notice { background: #3a2a1d; border: 1px solid #6b4a2e; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .searchbar { display: flex; gap: 8px; flex-wrap: wrap; }
  .searchbar input[type=text] { flex: 1 1 260px; font-size: 17px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 26px 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 12px;
    display: inline-flex; align-items: center; gap: 4px; }
  .chip:hover { border-color: var(--accent2); }
  .chip button.main { background: none; border: 0; padding: 0; }
  .chip button.x { background: none; border: 0; color: var(--muted); padding: 0 6px; font-size: 16px; line-height: 1; }
  .chip button.x:hover { color: var(--danger); }
  .tag { font-size: 11px; background: var(--panel2); border-radius: 4px; padding: 1px 5px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .item { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .item:hover { border-color: var(--accent); }
  .item .t { font-weight: 600; }
  .item .s { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .bar { height: 4px; background: var(--panel2); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .watch { margin-top: 18px; }
  .watch .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .watch h3 { margin: 0; font-size: 19px; }
  .player { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px;
    background: rgba(0,0,0,.55); }
  .overlay[hidden] { display: none; }
  .spinner { width: 34px; height: 34px; border: 3px solid #fff3; border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 10px 0; }
  .controls label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  .controls select { padding: 6px 8px; }
  .eps { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; max-height: 260px; overflow: auto; padding: 2px; }
  .ep { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 0; text-align: center; }
  .ep:hover { border-color: var(--accent2); }
  .ep.cur { background: var(--accent); border-color: var(--accent); color: #1a0f0b; font-weight: 700; }
  .ep.seen { color: var(--accent2); }
  .hint { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); }
  /* suggestions */
  .sughead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .sughead h2 { margin-bottom: 10px; }
  .genres { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .genres .tab { padding: 4px 11px; font-size: 13px; }
  .item .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
  /* admin panel */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
  .tab { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #1a0f0b; font-weight: 700; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile b { display: block; font-size: 22px; }
  .tile span { color: var(--muted); font-size: 12px; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { vertical-align: middle; }
  td.wrap { white-space: normal; word-break: break-word; min-width: 180px; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; background: var(--panel); }
  tr:last-child td { border-bottom: 0; }
  .barcell { min-width: 120px; }
  .barcell i { display: block; height: 8px; background: var(--accent); border-radius: 4px; min-width: 2px; }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn.danger:hover { background: var(--danger); color: #fff; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .datarow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 0; border-bottom: 1px solid var(--line); }
  .datarow:last-child { border-bottom: 0; }
  .datarow p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .flash { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel2);
    border: 1px solid var(--accent); border-radius: 8px; padding: 10px 16px; z-index: 10; }
  .st-bad { color: var(--danger); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" id="brand">Ma<span>do</span></div>
    <div class="who" id="who" hidden>
      <span id="whoName"></span>
      <button class="btn" id="adminBtn" hidden>Admin</button>
      <button class="btn" id="logout">Sign out</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <!-- Sign in / register -->
  <section id="authView" class="card auth" hidden>
    <h1 id="authTitle">Sign in</h1>
    <div class="hint">Your search history and last-watched episodes are saved to your account.</div>
    <form id="authForm">
      <input type="text" id="authUser" placeholder="Username" autocomplete="username" required>
      <input type="password" id="authPass" placeholder="Password" autocomplete="current-password" required>
      <button class="btn primary" id="authSubmit">Sign in</button>
    </form>
    <p class="error" id="authErr" role="alert"></p>
    <button class="link" id="authSwap">New here? Create an account</button>
    <button class="btn" id="guestBtn" type="button" style="margin-top:12px;width:100%">Continue as guest</button>
    <div class="hint" style="margin-top:6px">Guests can search and watch. No history or personal details are stored.</div>
  </section>

  <!-- Admin panel -->
  <section id="adminView" hidden>
    <div class="row" style="justify-content:space-between">
      <h1 style="margin:0;font-size:22px">Admin</h1>
      <button class="btn" id="adminBack">← Back to Mado</button>
    </div>
    <div class="tabs" id="adminTabs">
      <button class="tab" data-tab="overview">Overview</button>
      <button class="tab" data-tab="users">Users</button>
      <button class="tab" data-tab="requests">Requests</button>
      <button class="tab" data-tab="data">Data</button>
    </div>
    <div id="adminBody"></div>
  </section>

  <!-- Main app -->
  <main id="appView" hidden>
    <form class="searchbar" id="searchForm">
      <input type="text" id="q" placeholder="Search for an anime…" autocomplete="off" aria-label="Anime name">
      <select id="mode" aria-label="Audio">
        <option value="sub">Sub</option>
        <option value="dub">Dub</option>
      </select>
      <button class="btn primary" id="searchBtn">Search</button>
    </form>
    <p class="error" id="searchErr" role="alert"></p>

    <section id="sugBox">
      <div class="sughead"><h2 id="sugTitle">Suggestions</h2><button class="link" id="sugShuffle" type="button">shuffle</button></div>
      <div class="genres" id="sugGenres"></div>
      <div class="grid" id="sugList"></div>
    </section>

    <section id="watchView" class="watch" hidden>
      <div class="head">
        <h3 id="wTitle"></h3>
        <span class="hint" id="wSub"></span>
      </div>
      <div class="player">
        <video id="video" controls playsinline preload="auto"></video>
        <div class="overlay" id="overlay" hidden>
          <div><div class="spinner" id="spin"></div><div id="overlayMsg"></div>
            <button class="btn" id="retry" hidden style="margin-top:10px">Try again</button></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn" id="prev">⏮ Previous</button>
        <button class="btn" id="next">Next ⏭</button>
        <label><input type="checkbox" id="autoplay" checked> Autoplay next</label>
        <label>Quality
          <select id="quality">
            <option value="best">Best</option><option value="1080p">1080p</option>
            <option value="720p">720p</option><option value="480p">480p</option><option value="360p">360p</option>
          </select>
        </label>
      </div>
      <div class="eps" id="eps"></div>
    </section>

    <section id="continueBox" hidden>
      <h2>Continue watching</h2>
      <div class="grid" id="continueList"></div>
    </section>

    <section id="resultsBox" hidden>
      <h2 id="resultsTitle">Results</h2>
      <div class="grid" id="results"></div>
    </section>

    <section id="recentBox" hidden>
      <h2>Recent searches <button class="link" id="clearSearches">clear</button></h2>
      <div class="row" id="recent"></div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => {
    const n = Object.assign(document.createElement(tag), props);
    for (const k of kids) n.append(k);
    return n;
  };
  let guestMode = false;   // guests: nothing is stored, not even preferences in this browser
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { if (guestMode) return; try { localStorage.setItem(k, v); } catch {} },
  };

  async function api(path, opts = {}) {
    const init = { method: opts.method || "GET", credentials: "same-origin", keepalive: !!opts.keepalive, headers: { "X-Mado": "1" } };
    if (opts.body !== undefined) { init.body = JSON.stringify(opts.body); init.headers["Content-Type"] = "application/json"; }
    let res;
    try { res = await fetch(path, init); } catch { throw new Error("Can't reach the server."); }
    if (res.status === 204) return null;
    let data = null;
    try { data = await res.json(); } catch {}
    if (res.status === 401 && path !== "/api/login") { showAuth(); throw new Error("Sign in to continue."); }
    if (!res.ok) throw new Error((data && data.error) || `Request failed (${res.status}).`);
    return data;
  }

  // ---------------------------------------------------------------- state
  const S = {
    user: null, q: "", mode: "sub", entry: null, episodes: [], ep: null,
    last: null, playToken: 0, hls: null, prefetch: null, lastSave: 0, ended: false,
    resumeAt: 0, retried: false, canSave: false,
  };
  const video = $("video");

  // ---------------------------------------------------------------- auth
  let registering = false;
  function setAuthMode(reg) {
    registering = reg;
    $("authTitle").textContent = reg ? "Create account" : "Sign in";
    $("authSubmit").textContent = reg ? "Create account" : "Sign in";
    $("authSwap").textContent = reg ? "Have an account? Sign in" : "New here? Create an account";
    $("authPass").autocomplete = reg ? "new-password" : "current-password";
    $("authErr").textContent = "";
  }
  $("authSwap").onclick = () => setAuthMode(!registering);
  $("authForm").onsubmit = async (e) => {
    e.preventDefault();
    $("authErr").textContent = "";
    $("authSubmit").disabled = true;
    try {
      const r = await api(registering ? "/api/register" : "/api/login",
        { method: "POST", body: { username: $("authUser").value, password: $("authPass").value } });
      $("authPass").value = "";
      enter(r.user, false, !!r.admin);
    } catch (err) { $("authErr").textContent = err.message; }
    finally { $("authSubmit").disabled = false; }
  };
  $("guestBtn").onclick = async () => {
    $("authErr").textContent = "";
    try { const r = await api("/api/guest", { method: "POST", body: {} }); enter(r.user, true); }
    catch (err) { $("authErr").textContent = err.message; }
  };
  $("logout").onclick = async () => {
    saveProgress(true);
    stopPlayer();
    try { await api("/api/logout", { method: "POST", body: {} }); } catch {}
    S.user = null; showAuth();
  };

  function showAuth() {
    S.user = null; guestMode = false; closeAdmin(); $("adminBtn").hidden = true;
    $("continueBox").hidden = true; $("recentBox").hidden = true;
    $("authView").hidden = false; $("appView").hidden = true; $("who").hidden = true;
  }
  function enter(user, guest = false, isAdmin = false) {
    S.user = user; guestMode = guest;
    $("logout").textContent = guest ? "Sign in" : "Sign out";
    $("adminBtn").hidden = !isAdmin;
    closeAdmin();
    $("whoName").textContent = guest ? "Guest" : user;
    $("authView").hidden = true; $("appView").hidden = false; $("who").hidden = false;
    $("mode").value = guest ? "sub" : store.get("mado.mode", "sub");
    $("autoplay").checked = guest ? true : store.get("mado.autoplay", "1") === "1";
    $("quality").value = guest ? "best" : store.get("mado.quality", "best");
    S.watching = []; sugGenre = ""; renderSuggestions(); showSug(true);
    if (guest) { $("continueBox").hidden = true; $("recentBox").hidden = true; } else loadHistory();
  }

  // ---------------------------------------------------------------- history
  async function loadHistory() {
    let h;
    try { h = await api("/api/history"); } catch { return; }
    S.watching = h.watching; renderSuggestions();
    const cl = $("continueList"); cl.replaceChildren();
    for (const w of h.watching) {
      const pct = w.duration > 0 ? Math.min(100, (w.position / w.duration) * 100) : 0;
      const b = el("button", { className: "item", type: "button" },
        el("div", { className: "t", textContent: w.title }),
        el("div", { className: "s", textContent: `Episode ${w.episode}${w.total ? " of " + w.total : ""} · ${w.mode}` }));
      if (pct > 0) { const bar = el("div", { className: "bar" }); const i = el("i"); i.style.width = pct + "%"; bar.append(i); b.append(bar); }
      b.onclick = () => resume(w);
      const rm = el("button", { className: "link", type: "button", textContent: "remove" });
      rm.onclick = async (e) => {
        e.stopPropagation();
        await api("/api/history/watching/remove", { method: "POST", body: { show: w.show, mode: w.mode } }).catch(() => {});
        loadHistory();
      };
      b.append(rm);
      cl.append(b);
    }
    $("continueBox").hidden = !h.watching.length;

    const rc = $("recent"); rc.replaceChildren();
    for (const s of h.searches) {
      const main = el("button", { className: "main", type: "button", textContent: s.query });
      main.append(" ", el("span", { className: "tag", textContent: s.mode }));
      main.onclick = () => { $("q").value = s.query; $("mode").value = s.mode; doSearch(); };
      const x = el("button", { className: "x", type: "button", title: "Remove", textContent: "×" });
      x.onclick = async () => { await api("/api/history/searches/" + s.id, { method: "DELETE" }).catch(() => {}); loadHistory(); };
      rc.append(el("span", { className: "chip" }, main, x));
    }
    $("recentBox").hidden = !h.searches.length;
  }
  $("clearSearches").onclick = async () => {
    await api("/api/history/searches", { method: "DELETE" }).catch(() => {});
    loadHistory();
  };

  // ---------------------------------------------------------------- search
  $("searchForm").onsubmit = (e) => { e.preventDefault(); doSearch(); };
  $("mode").onchange = () => store.set("mado.mode", $("mode").value);

  async function doSearch() {
    const q = $("q").value.trim();
    if (!q) return;
    store.set("mado.mode", $("mode").value);
    $("searchErr").textContent = "";
    $("searchBtn").disabled = true; $("searchBtn").textContent = "Searching…";
    $("resultsBox").hidden = true; showSug(false);
    try {
      const r = await api(`/api/search?q=${encodeURIComponent(q)}&mode=${$("mode").value}`);
      S.q = r.query; S.mode = r.mode;
      renderResults(r.results);
      if (!guestMode) loadHistory();
    } catch (err) { $("searchErr").textContent = err.message; showSug(true); }
    finally { $("searchBtn").disabled = false; $("searchBtn").textContent = "Search"; }
  }

  function renderResults(results) {
    const box = $("results"); box.replaceChildren();
    $("resultsTitle").textContent = `Results for “${S.q}” (${results.length})`;
    for (const r of results) {
      const b = el("button", { className: "item", type: "button" },
        el("div", { className: "t", textContent: r.guessed ? r.title : r.title }),
        el("div", { className: "s", textContent: r.last_episode ? `Last watched: episode ${r.last_episode}` : "Not watched yet" }));
      b.onclick = () => openShow(S.q, S.mode, r.show, r.index, r.title, null);
      box.append(b);
    }
    $("resultsBox").hidden = false;
    $("resultsBox").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  // ---------------------------------------------------------------- show + episodes
  async function openShow(q, mode, show, index, title, startEp) {
    $("searchErr").textContent = "";
    $("watchView").hidden = false; showSug(false);
    $("wTitle").textContent = title;
    $("wSub").textContent = "Loading episodes…";
    $("eps").replaceChildren();
    saveProgress(true);
    stopPlayer();
    S.ep = null; S.entry = null; S.episodes = []; S.prefetch = null;
    showOverlay("Loading episodes…", true);
    $("watchView").scrollIntoView({ behavior: "smooth", block: "start" });
    let r;
    try {
      r = await api(`/api/episodes?q=${encodeURIComponent(q)}&mode=${mode}&show=${encodeURIComponent(show)}&index=${index}`);
    } catch (err) { showOverlay(err.message, false, null); return; }
    S.q = q; S.mode = mode; S.entry = r.entry; S.episodes = r.episodes; S.last = r.last;
    $("wTitle").textContent = r.entry.title;
    $("wSub").textContent = `${r.episodes.length} episode${r.episodes.length === 1 ? "" : "s"} · ${mode}`;
    renderEpisodes();
    let ep = startEp || (r.last && r.episodes.includes(r.last.episode) ? r.last.episode : null);
    // finished the last episode we saved? offer the next one instead
    if (!startEp && r.last && ep && r.last.duration > 0 && r.last.position >= r.last.duration - 30) {
      const nx = r.episodes[r.episodes.indexOf(ep) + 1];
      if (nx) ep = nx;
    }
    if (ep) playEpisode(ep);
    else showOverlay("Pick an episode to start watching.", false, null);
  }

  function resume(w) { openShow(w.query, w.mode, w.show, w.index, w.title, w.episode); }

  function renderEpisodes() {
    const box = $("eps"); box.replaceChildren();
    for (const ep of S.episodes) {
      const b = el("button", { className: "ep", type: "button", textContent: ep });
      if (ep === S.ep) b.classList.add("cur");
      else if (S.last && S.last.episode === ep) b.classList.add("seen");
      b.onclick = () => playEpisode(ep);
      box.append(b);
    }
    const cur = box.querySelector(".cur");
    if (cur) cur.scrollIntoView({ block: "nearest" });
    const i = S.episodes.indexOf(S.ep);
    $("prev").disabled = i <= 0;
    $("next").disabled = i < 0 || i >= S.episodes.length - 1;
  }

  // ---------------------------------------------------------------- playback
  function showOverlay(msg, spin, retry) {
    $("overlay").hidden = false;
    $("overlayMsg").textContent = msg;
    $("spin").hidden = !spin;
    $("retry").hidden = !retry;
    $("retry").onclick = retry || null;
  }
  const hideOverlay = () => { $("overlay").hidden = true; };

  function stopPlayer() {
    S.playToken++;
    if (S.hls) { S.hls.destroy(); S.hls = null; }
    video.pause();
    video.removeAttribute("src");
    video.querySelectorAll("track").forEach((t) => t.remove());
    video.load();
  }

  function playReq(ep) {
    return api("/api/play", { method: "POST", body: {
      q: S.q, mode: S.mode, show: S.entry.show, index: S.entry.index, episode: ep, quality: $("quality").value,
    } });
  }

  function seeded(seed) {   // small deterministic RNG so the list stays put when history refreshes

    const tb = el("div");
    async function load(append) {
      const params = new URLSearchParams({ limit: "100" });
      if (kind.value) params.set("kind", kind.value);
      if (q.value.trim()) params.set("q", q.value.trim());
      if (append && next) params.set("before", next);
      const r = await api("/api/admin/requests?" + params);
      const rows = r.events.map((e) => [fmtTime(e.ts), e.username, e.kind, el("span", { className: e.status >= 400 ? "st-bad" : "", textContent: String(e.status || "") }), e.detail, e.ip]);
      const t = table(["Time", "User", "Kind", "Status", "Detail", "IP"], rows, "No matching requests.");
      t.querySelectorAll("tbody tr td:nth-child(5)").forEach((td) => td.classList.add("wrap"));
      if (append) { const old = tb.querySelector("tbody"); t.querySelectorAll("tbody tr").forEach((tr) => old.append(tr)); }
      else tb.replaceChildren(t);
      next = r.next; more.hidden = !r.next;
    }
    const go = () => load(false).catch((err) => flash(err.message));
    kind.onchange = go; refresh.onclick = go; more.onclick = () => load(true).catch((err) => flash(err.message));
    let t = 0; q.oninput = () => { clearTimeout(t); t = setTimeout(go, 350); };
    body.replaceChildren(el("div", { className: "filters" }, kind, q, refresh), tb, more,
      el("p", { className: "hint", textContent: "Guest requests are logged without the search text or IP address. The log keeps the latest 50,000 entries or ANIWEB_LOG_DAYS days." }));
    await load(false);
  }

  async function renderData(body) {
    const o = await api("/api/admin/overview");
    if (adminTab !== "data") return;
    const days = el("select", {}, ...[["0", "everything"], ["30", "older than 30 days"], ["7", "older than 7 days"]].map(([v, t]) => el("option", { value: v, textContent: t })));
    async function act(target, confirmText, extra = {}) {
      if (confirmText && !confirm(confirmText)) return;
      try { const r = await api("/api/admin/data/clear", { method: "POST", body: { target, ...extra } }); flash(r.deleted ? `Done, ${r.deleted} entries removed.` : "Done."); showTab("data"); }
      catch (err) { flash(err.message); }
    }
    const row = (title, desc, ...controls) => el("div", { className: "datarow" }, el("div", {}, el("b", { textContent: title }), el("p", { textContent: desc })), el("div", { className: "row" }, ...controls));
    const btn = (label, fn, danger = true) => { const b = el("button", { className: "btn small" + (danger ? " danger" : ""), type: "button", textContent: label }); b.onclick = fn; return b; };
    body.replaceChildren(
      el("div", { className: "tiles" }, tile(fmtBytes(o.system.db_size), "database size"), tile(o.events_total, "request log entries"),
        tile(o.saved_searches, "saved searches"), tile(o.tracked_shows, "watch-progress entries")),
      el("div", { className: "card", style: "margin-top:14px" },
        row("Request log", "Who searched and played what, with IP addresses (not for guests).", days,
          btn("Delete", () => act("requests", "Delete these request log entries?", { days: Number(days.value) }))),
        row("Usage statistics", "Daily totals and streamed data, per user.", btn("Reset", () => act("usage", "Reset all usage statistics?"))),
        row("Search history", "Everybody's saved searches (accounts stay).", btn("Delete all", () => act("search_history", "Delete every user's saved searches?"))),
        row("Watch progress", "Everybody's last watched episodes and positions (accounts stay).", btn("Delete all", () => act("watch_progress", "Delete every user's watch progress?"))),
        row("Server caches", "Cached search results and stream links. Safe to clear.", btn("Clear", () => act("caches", ""), false)),
        row("Compact database", "Frees disk space after deleting lots of data.", btn("Compact", () => act("vacuum", ""), false))),
      el("p", { className: "hint", textContent: "To delete a single account, use the Users tab." }));
  }

  // ---------------------------------------------------------------- boot
  (async function boot() {
    setAuthMode(false);
    try {
      const st = await fetch("/api/status").then((r) => r.json());
      if (!st.ok) {
        const n = $("notice"); n.hidden = false;
        n.textContent = "The server is missing: " + st.missing.join(", ") + ". Install it and restart Mado.";
      }
    } catch {}
    try {
      const me = await api("/api/me");
      if (me.user) enter(me.user, !!me.guest, !!me.admin); else showAuth();
    } catch { showAuth(); }
  })();
})();
</script>
</body>
</html>
